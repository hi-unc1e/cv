<svg xmlns="http://www.w3.org/2000/svg" width="560" height="662" viewBox="0 0 560 662" role="img" aria-labelledby="title desc">
<title id="title">Divide responsibilities across model, code and engine</title><desc id="desc">The model proposes intent and ambiguities are clarified. Deterministic code validates structure, applies explicit rules and rejects unsupported conversions. The target engine executes queries and results are checked.</desc>
<rect width="560" height="662" rx="24" fill="#101827"/>
<g font-family="Arial, sans-serif"><text x="28" y="44" fill="#93c5fd" font-size="18" letter-spacing="2">03 / WHO DOES WHAT?</text>
<rect x="24" y="72" width="512" height="150" rx="16" fill="#1d293e"/>
<text x="44" y="112" fill="#c4b5fd" font-size="28" font-weight="bold">LLM</text><text x="44" y="157" fill="#f8fafc" font-size="24">Propose the query intent</text><text x="44" y="194" fill="#cbd5e1" font-size="24">Clarify ambiguous requirements</text>
<path d="M280 234v27m-9-9 9 9 9-9" stroke="#93c5fd" stroke-width="3" fill="none"/>
<rect x="24" y="274" width="512" height="174" rx="16" fill="#173457" stroke="#60a5fa"/>
<text x="44" y="315" fill="#93c5fd" font-size="28" font-weight="bold">Deterministic code</text><text x="44" y="357" fill="#f8fafc" font-size="24">Validate structure · apply rules</text><text x="44" y="396" fill="#f8fafc" font-size="24">Reject unsupported conversions</text><text x="44" y="430" fill="#cbd5e1" font-size="21">Known inputs → testable outputs</text>
<path d="M280 460v27m-9-9 9 9 9-9" stroke="#93c5fd" stroke-width="3" fill="none"/>
<rect x="24" y="500" width="512" height="136" rx="16" fill="#17372d"/>
<text x="44" y="541" fill="#a7f3d0" font-size="28" font-weight="bold">Target engine</text><text x="44" y="583" fill="#f8fafc" font-size="24">Execute the query</text><text x="44" y="618" fill="#cbd5e1" font-size="24">Check rows, values and order</text></g></svg>
